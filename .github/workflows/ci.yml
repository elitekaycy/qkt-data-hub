name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: python -m ruff check hub hubread tests
      - run: python -m mypy
      - run: python -m unittest discover -s tests -t . -v
      - name: the runtime has no third-party imports
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = sys.stdlib_module_names
          bad = []
          for path in list(pathlib.Path("hub").rglob("*.py")) + list(pathlib.Path("hubread").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module.split(".")[0]]
                  for name in names:
                      if name not in stdlib and name not in {"hub", "hubread"}:
                          bad.append(f"{path}: {name}")
          if bad:
              print("::error::runtime imports outside the stdlib: " + ", ".join(bad))
              raise SystemExit(1)
          print("runtime is stdlib only")
          PY
      - name: the reader never imports the writer
        run: |
          set -euo pipefail
          if grep -rnE '^\s*(from|import)\s+hub(\.|\s|$)' hubread/; then
            echo "::error::hubread must stay standalone; it may not import hub"
            exit 1
          fi
          echo "hubread is standalone"
      - name: pyproject version and hub.__version__ agree
        run: |
          set -euo pipefail
          py="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mod="$(python -c 'import hub;print(hub.__version__)')"
          [ "$py" = "$mod" ] || { echo "::error::pyproject $py != hub.__version__ $mod"; exit 1; }

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qkt-data-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the real pipeline against a local fixture feed
        run: |
          set -euo pipefail
          # A fixture server, not the real provider: CI must not fail because a third party is
          # down, and must not hammer someone else's endpoint on every push.
          python3 - <<'PY' &
          import http.server, pathlib
          BODY = pathlib.Path("tests/fixtures/forexfactory_thisweek.json").read_bytes()
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(BODY)))
                  self.end_headers()
                  self.wfile.write(BODY)
              def log_message(self, *a): pass
          http.server.HTTPServer(("0.0.0.0", 8791), H).serve_forever()
          PY
          for _ in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:8791/feed && break; sleep 0.25; done

          mkdir -p smoke/data smoke/datasets && chmod -R 777 smoke
          sed 's#https://nfs.faireconomy.media/ff_calendar_thisweek.json#http://172.17.0.1:8791/feed#' \
            datasets/cal.high_impact.yaml > smoke/datasets/cal.high_impact.yaml

          run() {
            docker run --rm --add-host=host.docker.internal:host-gateway \
              -v "$PWD/smoke/data:/data" -v "$PWD/smoke/datasets:/app/datasets:ro" \
              qkt-data-hub:ci "$@"
          }

          run validate
          run collect
          run compile
          run verify

          test -s smoke/data/manifest.json || { echo "::error::no manifest written"; exit 1; }
          ls smoke/data/snapshot/cal.high_impact/*/*.qkh >/dev/null || { echo "::error::no snapshot"; exit 1; }
          ls smoke/data/journal/cal.high_impact/*.ndjson >/dev/null || { echo "::error::no journal"; exit 1; }

          # A second collect of unchanged bytes must add nothing: the dedupe promise, end to end.
          before=$(wc -l < smoke/data/journal/cal.high_impact/*.ndjson)
          run collect
          after=$(wc -l < smoke/data/journal/cal.high_impact/*.ndjson)
          [ "$before" = "$after" ] || { echo "::error::re-collect grew the journal ($before -> $after)"; exit 1; }

          # A tampered snapshot must make verify fail. A verify that cannot fail proves nothing.
          python3 - <<'PY'
          import glob, pathlib
          p = pathlib.Path(glob.glob("smoke/data/snapshot/cal.high_impact/*/*.qkh")[0])
          b = bytearray(p.read_bytes()); b[len(b)//2] ^= 0xFF; p.write_bytes(bytes(b))
          PY
          if run verify; then echo "::error::verify passed a tampered snapshot"; exit 1; fi
          echo "docker smoke passed"

  publish:
    needs: docker-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qkt-data-hub:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/qkt-data-hub:latest
