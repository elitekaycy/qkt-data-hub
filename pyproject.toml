[project]
name = "qkt-data-hub"
version = "0.1.2"
description = "A point-in-time fact store for trading systems: one record format, live tail and historical snapshot from the same bytes."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["hub", "hubread"]
